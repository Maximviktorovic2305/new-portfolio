name: Deploy Portfolio to Server

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: Production
    timeout-minutes: 30

    steps:
      - name: Deploy to server
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e

            # Load nvm (if installed)
            export NVM_DIR="$HOME/.nvm"
            if [ -s "$NVM_DIR/nvm.sh" ]; then
              . "$NVM_DIR/nvm.sh"
            fi

            # Ensure Node is in PATH (adjust if needed)
            export PATH="$NVM_DIR/versions/node/v20.19.4/bin:$HOME/.npm-global/bin:$PATH"

            # SSH config for GitHub private repo using deploy key (REPO_DEPLOY_KEY)
            mkdir -p ~/.ssh
            chmod 700 ~/.ssh
            ssh-keyscan github.com >> ~/.ssh/known_hosts
            chmod 600 ~/.ssh/known_hosts

            cat > ~/.ssh/portfolio_repo << 'EOF'
            ${{ secrets.REPO_DEPLOY_KEY }}
            EOF
            chmod 600 ~/.ssh/portfolio_repo

            cat > ~/.ssh/config << 'EOF'
            Host github.com
              HostName github.com
              User git
              IdentityFile ~/.ssh/portfolio_repo
              IdentitiesOnly yes
            EOF
            chmod 600 ~/.ssh/config

            # App config
            APP_DIR="/home/max/portfolio"
            REPO_SSH="git@github.com:Maximviktorovic2305/new-portfolio.git"
            PORT="3015"

            # Detect branch from GitHub push
            BRANCH="${GITHUB_REF_NAME:-master}"

            mkdir -p "$APP_DIR"

            # Clone / Update
            if [ -d "$APP_DIR/.git" ]; then
              cd "$APP_DIR"
              git fetch origin
              git reset --hard "origin/$BRANCH"
              git clean -fdx
            else
              rm -rf "$APP_DIR"
              git clone -b "$BRANCH" "$REPO_SSH" "$APP_DIR"
              cd "$APP_DIR"
            fi

            # Create .env from GitHub Secrets
            cat > .env << EOF
            VITE_EMAILJS_SERVICE_ID=${{ secrets.VITE_EMAILJS_SERVICE_ID }}
            VITE_EMAILJS_TEMPLATE_ID=${{ secrets.VITE_EMAILJS_TEMPLATE_ID }}
            VITE_EMAILJS_PUBLIC_KEY=${{ secrets.VITE_EMAILJS_PUBLIC_KEY }}
            EOF

            # Install & build (React + Vite)
            if [ -f package-lock.json ]; then
              npm ci
            else
              npm install --no-audit --no-fund
            fi
            npm run build

            # Start in production mode and restart PM2 process
            export NODE_ENV=production
            export PORT="$PORT"
            pm2 delete portfolio || true
            pm2 start npm --name portfolio -- start
            pm2 save
            pm2 list

            # Health check: fail deployment if app is not serving locally
            sleep 3
            if command -v curl >/dev/null 2>&1; then
              HEALTH_OK=0
              curl -fsS "http://127.0.0.1:${PORT}" >/dev/null || HEALTH_OK=1
            elif command -v wget >/dev/null 2>&1; then
              HEALTH_OK=0
              wget -q -O /dev/null "http://127.0.0.1:${PORT}" || HEALTH_OK=1
            else
              echo "No curl/wget found; skipping health check"
              HEALTH_OK=0
            fi

            if [ "$HEALTH_OK" -ne 0 ]; then
              echo "Health check failed on port ${PORT}"
              pm2 status
              pm2 logs portfolio --lines 80 --nostream || true
              exit 1
            fi

            echo "Deployment complete: http://$(hostname -I | awk '{print $1}'):${PORT}"
