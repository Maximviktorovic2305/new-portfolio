name: Deploy portfolio

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: portfolio-production
  cancel-in-progress: false

env:
  VITE_YANDEX_METRIKA_ID: "111446691"

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: ".nvmrc"
          cache: npm

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Run project checks
        run: npm run check

  deploy:
    needs: validate
    runs-on: ubuntu-latest
    environment: Production
    timeout-minutes: 30

    steps:
      - name: Deploy to server
        uses: appleboy/ssh-action@2ead5e36573f08b82fbfce1504f1a4b05a647c6f
        env:
          VITE_YANDEX_METRIKA_ID: "111446691"
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 25m
          envs: VITE_YANDEX_METRIKA_ID
          script: |
            set -eu

            APP_DIR="/home/max/portfolio"
            REPO_SSH="git@github.com:Maximviktorovic2305/new-portfolio.git"
            BRANCH="${{ github.ref_name }}"

            export NVM_DIR="$HOME/.nvm"
            test -s "$NVM_DIR/nvm.sh"
            . "$NVM_DIR/nvm.sh"
            nvm install 24
            nvm use 24
            node -v
            npm -v
            command -v git >/dev/null
            command -v curl >/dev/null
            command -v pm2 >/dev/null 2>&1 || npm install --global pm2@7.0.3 --no-audit --no-fund

            mkdir -p ~/.ssh
            chmod 700 ~/.ssh
            if ! ssh-keygen -F github.com >/dev/null; then
              ssh-keyscan -H github.com >> ~/.ssh/known_hosts
            fi
            chmod 600 ~/.ssh/known_hosts

            DEPLOY_KEY="$(mktemp "$HOME/.ssh/portfolio-deploy.XXXXXX")"
            trap 'rm -f "$DEPLOY_KEY"' EXIT
            cat > "$DEPLOY_KEY" << 'EOF'
            ${{ secrets.REPO_DEPLOY_KEY }}
            EOF
            chmod 600 "$DEPLOY_KEY"
            export GIT_SSH_COMMAND="ssh -i $DEPLOY_KEY -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes"

            if [ -d "$APP_DIR/.git" ]; then
              cd "$APP_DIR"
              git config core.autocrlf false
              git fetch --prune origin "$BRANCH"
              git reset --hard "origin/$BRANCH"
              git clean -fdx
            else
              test ! -e "$APP_DIR" || rmdir "$APP_DIR"
              git -c core.autocrlf=false clone -b "$BRANCH" "$REPO_SSH" "$APP_DIR"
              cd "$APP_DIR"
              git config core.autocrlf false
            fi

            umask 077
            cat > .env << EOF
            VITE_EMAILJS_SERVICE_ID=${{ secrets.VITE_EMAILJS_SERVICE_ID }}
            VITE_EMAILJS_TEMPLATE_ID=${{ secrets.VITE_EMAILJS_TEMPLATE_ID }}
            VITE_EMAILJS_PUBLIC_KEY=${{ secrets.VITE_EMAILJS_PUBLIC_KEY }}
            VITE_YANDEX_METRIKA_ID=${VITE_YANDEX_METRIKA_ID}
            EOF

            npm ci
            npm run check
            npm prune --omit=dev

            pm2 delete portfolio || true
            pm2 start npm --name portfolio --cwd "$APP_DIR" -- start
            pm2 save

            HEALTHY=0
            for attempt in 1 2 3 4 5 6; do
              if curl --fail --silent --show-error http://127.0.0.1:3015/ >/dev/null; then
                HEALTHY=1
                break
              fi
              sleep 2
            done
            if [ "$HEALTHY" -ne 1 ]; then
              pm2 logs portfolio --lines 80 --nostream || true
              exit 1
            fi

            curl --fail --silent http://127.0.0.1:3015/robots.txt | grep -q 'Sitemap:'
            curl --fail --silent --head http://127.0.0.1:3015/ | grep -qi '^Content-Security-Policy:'
            pm2 status portfolio
